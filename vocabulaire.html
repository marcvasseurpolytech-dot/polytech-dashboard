<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284B">
<title>Vocabulaire anglais · Polytech Lille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Direction: navy band and cream pages, gold for what is active; phone first, bottom tab bar on small screens. */
:root {
  --bg: #FBF6E9;
  --surface: #FFFDF6;
  --chip: #F1E8CC;
  --ink: #14284B;
  --muted: #55627D;
  --line: #E2D8BC;
  --band: #14284B;
  --band-ink: #FBF6E9;
  --gold: #D9A92B;
  --gold-text: #7A5800;
  --accent: #14284B;
  --accent-ink: #FBF6E9;
  --good: #1D6F46;
  --good-bg: #E3F2E8;
  --bad: #A02D28;
  --bad-bg: #FBE6E3;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1830;
    --surface: #14274A;
    --chip: #1E3560;
    --ink: #F3EBD4;
    --muted: #A9B5CE;
    --line: #2A3F66;
    --band: #091226;
    --band-ink: #F3EBD4;
    --gold: #E2B53F;
    --gold-text: #E2B53F;
    --accent: #E2B53F;
    --accent-ink: #0C1830;
    --good: #7FD3A0;
    --good-bg: #123626;
    --bad: #F4948C;
    --bad-bg: #421C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1830;
  --surface: #14274A;
  --chip: #1E3560;
  --ink: #F3EBD4;
  --muted: #A9B5CE;
  --line: #2A3F66;
  --band: #091226;
  --band-ink: #F3EBD4;
  --gold: #E2B53F;
  --gold-text: #E2B53F;
  --accent: #E2B53F;
  --accent-ink: #0C1830;
  --good: #7FD3A0;
  --good-bg: #123626;
  --bad: #F4948C;
  --bad-bg: #421C1A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.5;
}
button, select, input, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}

.band { background: var(--band); color: var(--band-ink); padding: calc(env(safe-area-inset-top, 0px) + 28px) 0 0; }
.band h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.1rem, 8vw, 3.4rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.band .sub { margin: 8px 0 22px; opacity: 0.8; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs a {
  padding: 10px 22px;
  border-radius: 10px 10px 0 0;
  color: var(--band-ink);
  text-decoration: none;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.08);
}
.tabs a:hover { background: rgba(255, 255, 255, 0.16); }
.tabs a[aria-current="page"] { background: var(--bg); color: var(--ink); }
.tabs a:focus-visible, .btn:focus-visible, .star:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible, .opt:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

main { padding-top: 20px; padding-bottom: 28px; }

.scope { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
.scope label, .tools label, .deckbar label, .row label { font-weight: 600; color: var(--muted); font-size: 0.95rem; }
select, input[type="search"] {
  font: inherit;
  font-size: 16px;
  min-height: 46px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
}
.scope select { flex: 1 1 220px; }
.count-note { color: var(--muted); font-size: 0.95rem; }

.tools {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 8px 0;
  margin-bottom: 4px;
  background: var(--bg);
}
.tools input[type="search"] { flex: 1 1 100%; min-width: 0; }
.tools select { flex: 1 1 140px; }
.info { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }

#list { display: flex; flex-direction: column; gap: 12px; }
.entry {
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.tag { align-self: flex-start; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; color: var(--gold-text); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.entry h3 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.pron { display: block; margin: 3px 0 0; font-family: var(--font-mono); font-weight: 400; font-size: 0.82rem; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
.fr { margin: 0; font-size: 1.12rem; overflow-wrap: anywhere; }
.syn { margin-top: 6px; }
.k { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-text); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.chips li { font-size: 0.95rem; padding: 3px 11px; border-radius: 999px; background: var(--chip); }
.ex { margin: 8px 0 0; padding: 10px 12px; background: var(--chip); border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; font-size: 1rem; }
.ex em { display: block; font-style: italic; }
.ex span { display: block; margin-top: 2px; color: var(--muted); }
.meta { margin: 8px 0 0; font-size: 0.95rem; color: var(--muted); }
.meta b { color: var(--gold-text); }
.star {
  flex: none;
  width: 48px; height: 48px;
  font-size: 1.6rem; line-height: 1;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.star[aria-pressed="true"] { color: var(--gold-text); background: rgba(217, 169, 43, 0.2); border-color: var(--gold); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

.btn {
  font: inherit; font-weight: 600;
  min-height: 50px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--gold); background: rgba(217, 169, 43, 0.2); color: var(--gold-text); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.deckbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 8px; }
.deckbar select { flex: 1 1 140px; }
.card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  min-height: 240px;
  padding: 24px 18px;
  text-align: center;
  background: var(--surface);
  border: 2px solid var(--gold);
  border-radius: 22px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.face-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-text); }
.big { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 8vw, 3rem); line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.big.fr-side { font-weight: 500; font-size: clamp(1.5rem, 6.5vw, 2.2rem); }
.card .pron { margin: 0; font-size: 1rem; }
.card .details { width: 100%; max-width: 560px; text-align: left; margin-top: 6px; }
.card .hint { margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.controls .wide { grid-column: 1 / -1; }
.controls.single { grid-template-columns: 1fr; }

.panel { padding: 20px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.panel h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 1.6rem; }
.panel > p { margin: 0 0 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
.row select { flex: 1 1 200px; }
.qhead { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.prompt { margin: 0 0 16px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 6vw, 2.2rem); line-height: 1.2; overflow-wrap: anywhere; }
.prompt .pron { margin: 4px 0 0; font-size: 0.95rem; }
.opts { display: grid; gap: 10px; }
.opt {
  font: inherit; font-size: 1.05rem; text-align: left;
  min-height: 54px;
  padding: 12px 16px;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.feedback { margin: 16px 0 6px; font-weight: 700; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.errors { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
.errors li { padding: 10px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow-wrap: anywhere; }
.errors b { font-family: var(--font-display); }

footer { border-top: 1px solid var(--line); padding: 18px 0 30px; color: var(--muted); font-size: 0.88rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
footer strong { letter-spacing: 0.06em; color: var(--ink); }


/* ---- trois mots du jour ---- */
.dhead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.dtitle { margin: 0; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.2; }
.dhead .info { margin: 0; }
#dcards { display: flex; flex-direction: column; gap: 14px; }
.dcard { display: flex; flex-direction: column; gap: 8px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 16px; }
.dcard.ok { border-left-color: var(--good); }
.dcard.ko { border-left-color: var(--bad); }
.dtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dword { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 6.5vw, 2.2rem); line-height: 1.15; overflow-wrap: anywhere; }
.dword.fr-side { font-weight: 500; font-size: clamp(1.3rem, 5.5vw, 1.8rem); }
.answer { margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
.answer > .pron { margin-bottom: 4px; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.rate .btn { min-height: 54px; }
.btn.no { border-color: var(--bad); color: var(--bad); }
.result { margin: 10px 0 0; font-weight: 700; }
.result.good { color: var(--good); }
.result.bad { color: var(--bad); }
.nextnote { font-weight: 400; color: var(--muted); font-size: 0.92rem; }
.dsum { margin-top: 14px; text-align: center; }
.lvl { font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); white-space: nowrap; }
.lvl-new { color: var(--muted); }
.lvl-weak { color: var(--bad); border-color: var(--bad); }
.lvl-learning { color: var(--gold-text); border-color: var(--gold); }
.lvl-mastered { color: var(--good); border-color: var(--good); }

/* ---- suivi ---- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.kpi b { display: block; font-family: var(--font-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { display: block; margin-top: 6px; font-size: 0.9rem; color: var(--muted); }
.kpi.mastered b { color: var(--good); }
.kpi.learning b { color: var(--gold-text); }
.kpi.weak b { color: var(--bad); }
.block { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; }
.block h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.2rem; }
.block p { margin: 0 0 10px; }
.block .meta { margin-top: 0; }
.bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--chip); margin: 8px 0 6px; }
.bar i { display: block; height: 100%; }
.bar .b-mastered { background: var(--good); }
.bar .b-learning { background: var(--gold); }
.bar .b-weak { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.88rem; color: var(--muted); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stats3 .kpi b { font-size: 1.6rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wday .num { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.3em; }
.wday .area { height: 84px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.wday .col { width: 100%; max-width: 34px; display: flex; flex-direction: column; border-radius: 6px 6px 2px 2px; overflow: hidden; }
.wday .col i { display: block; width: 100%; }
.wday .col .c-ok { background: var(--good); }
.wday .col .c-ko { background: var(--bad); }
.wday .col.zero { height: 3px; background: var(--line); }
.wday .lab { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.wday.today .lab { color: var(--gold-text); }
.sync-form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.sync-form input { flex: 1 1 220px; min-width: 0; }
.sync-status { margin: 10px 0 0; font-size: 0.95rem; color: var(--muted); min-height: 1.4em; }
.btn.danger { border-color: var(--bad); color: var(--bad); }

@media (min-width: 641px) {
  .tools input[type="search"] { flex: 1 1 260px; }
  .controls { max-width: 560px; margin-left: auto; margin-right: auto; }
  .panel { padding: 24px; }
}
@media (max-width: 640px) {
  .band { padding-bottom: 18px; }
  .band .sub { margin: 6px 0 0; font-size: 0.95rem; }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--band);
    border-top: 1px solid rgba(255, 255, 255, 0.18);
  }
  .tabs a { border-radius: 0; background: transparent; text-align: center; padding: 15px 2px; min-height: 54px; font-size: 0.95rem; }
  .tabs a:hover { background: transparent; }
  .tabs a[aria-current="page"] { background: transparent; color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }
  footer { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .star { transition: background-color 0.15s, border-color 0.15s; }
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1>Vocabulaire anglais</h1>
    <p class="sub" id="count"></p>
    <nav class="tabs" aria-label="Sections">
      <a href="#mots" data-tab="mots">3 mots</a>
      <a href="#liste" data-tab="liste">Liste</a>
      <a href="#fiches" data-tab="fiches">Fiches</a>
      <a href="#quiz" data-tab="quiz">Quiz</a>
      <a href="#suivi" data-tab="suivi">Suivi</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="scope" id="scopeBar" hidden>
    <label for="scope">Mots concernés</label>
    <select id="scope"></select>
    <span class="count-note" id="scopeCount"></span>
  </div>

  <section id="view-mots" aria-label="Trois mots à apprendre">
    <div class="dhead">
      <h2 class="dtitle">Trois mots pour aujourd’hui</h2>
      <p class="info" id="dailyInfo" aria-live="polite"></p>
      <div class="deckbar">
        <label for="dailyDir">Voir d’abord</label>
        <select id="dailyDir">
          <option value="enfr">L’anglais</option>
          <option value="fren">Le français</option>
        </select>
        <button type="button" class="btn" id="redraw">Autres mots</button>
      </div>
    </div>
    <div id="dailybox">
      <div id="dcards"></div>
      <div id="dsummary"></div>
    </div>
  </section>

  <section id="view-liste" aria-label="Liste du vocabulaire" hidden>
    <div class="tools">
      <input type="search" id="q" placeholder="Rechercher en anglais ou en français" aria-label="Rechercher un mot" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="sort">Tri</label>
      <select id="sort">
        <option value="note">Ordre de la note</option>
        <option value="az">A à Z</option>
      </select>
    </div>
    <p class="info" id="resultInfo" aria-live="polite"></p>
    <div id="list"></div>
  </section>

  <section id="view-fiches" aria-label="Fiches à retourner" hidden>
    <div class="deckbar">
      <label for="dir">Face visible</label>
      <select id="dir">
        <option value="enfr">Anglais</option>
        <option value="fren">Français</option>
      </select>
      <button type="button" class="btn" id="shuffle">Mélanger</button>
    </div>
    <p class="info" id="counter" aria-live="polite"></p>
    <div id="cardbox"></div>
    <div class="controls">
      <button type="button" class="btn" id="prev">◀&#xFE0E; Précédent</button>
      <button type="button" class="btn" id="next">Suivant ▶&#xFE0E;</button>
      <button type="button" class="btn primary wide" id="flipBtn">Retourner</button>
      <button type="button" class="btn wide" id="favBtn" aria-pressed="false">☆ À revoir</button>
    </div>
  </section>

  <section id="view-quiz" aria-label="Quiz" hidden>
    <div id="quizbox"></div>
  </section>

  <section id="view-suivi" aria-label="Suivi de la progression" hidden>
    <div id="statsbox"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span><strong>MARC VASSEUR | POLYTECH LILLE</strong></span>
    <span>Marc Vasseur, marc.vasseur@polytech-lille.fr</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var TYPES = { verbe: "Verbe", adj: "Adjectif / adverbe", nom: "Nom", expr: "Expression", argot: "Argot" };
  var SCOPES = [
    ["all", "Tout le vocabulaire"],
    ["verbe", "Verbes"],
    ["adj", "Adjectifs et adverbes"],
    ["nom", "Noms"],
    ["expr", "Expressions"],
    ["argot", "Argot et familier"],
    ["fav", "Mes mots à revoir"]
  ];

  /* g = confusable group: two words sharing g are never offered as wrong answers for each other in the quiz. */
  var WORDS = [
    { en: "Irretrievably", pron: "/ˌɪrɪˈtriːvəbli/", type: "adj", fr: "irrémédiablement ; irrévocablement",
      syn: "irrevocably, permanently, beyond repair",
      exs: [["The files were irretrievably lost after the crash.", "Les fichiers ont été irrémédiablement perdus après la panne."]] },
    { en: "Tailgate", pron: "/ˈteɪlɡeɪt/", type: "nom", fr: "hayon (d’une voiture)",

  function norm(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’‘]/g, "'").toLowerCase();
  }
  WORDS.forEach(function (w) {
    w.hay = norm([w.en, w.alt || "", w.fr, w.syn || ""].join(" "));
    w.sortKey = norm(w.en).replace(/^(to be |to |a |an |the )/, "");
  });

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* favourites (words to review), kept in this browser only */
  var KEY = "vocabulaire-anglais-a-revoir";
  var favs = new Set();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) favs = new Set(arr);
    }
  } catch (e) { /* storage unavailable */ }
  function saveFavs() {
    try { localStorage.setItem(KEY, JSON.stringify(Array.from(favs))); } catch (e) { /* ignore */ }
  }

  var state = { tab: "mots", scope: "all", query: "", sort: "note" };
  var card = { deck: [], i: 0, flipped: false, dir: "enfr" };
  var quiz = { phase: "setup", dir: "enfr", n: "10", qs: [], i: 0, answered: false, picked: -1, score: 0, wrong: [] };

  function scopeList() {
    if (state.scope === "all") return WORDS.slice();
    if (state.scope === "fav") return WORDS.filter(function (w) { return favs.has(w.en); });
    return WORDS.filter(function (w) { return w.type === state.scope; });
  }

  function details(w) {
    var h = "";
    if (w.syn) {
      h += '<div class="syn"><span class="k">Synonymes</span><ul class="chips">' +
        w.syn.split(/,\s*/).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
    }
    (w.exs || []).forEach(function (p) {
      h += '<p class="ex"><em>' + esc(p[0]) + "</em><span>" + esc(p[1]) + "</span></p>";
    });
    if (w.def) h += '<p class="meta"><b>Définition</b> : ' + esc(w.def) + "</p>";
    if (w.alt) h += '<p class="meta"><b>Variante</b> : ' + esc(w.alt) + "</p>";
    if (w.note) h += '<p class="meta">' + esc(w.note) + "</p>";
    return h;
  }

  function tagLabel(w) {
    return TYPES[w.type] + (w.reg ? " · " + w.reg : "");
  }

  function emptyMessage() {
    if (state.scope === "fav") {
      return '<div class="empty">Aucun mot à revoir pour l’instant. Touche l’étoile à côté d’un mot pour l’ajouter ici.</div>';
    }
    return '<div class="empty">Aucun mot ne correspond.</div>';
  }

  /* ---------- Liste ---------- */
  function renderList() {
    var q = norm(state.query.trim());
    var items = scopeList().filter(function (w) { return !q || w.hay.indexOf(q) !== -1; });
    if (state.sort === "az") {
      items.sort(function (a, b) { return a.sortKey.localeCompare(b.sortKey); });
    }
    $("#resultInfo").textContent = items.length + (items.length > 1 ? " mots affichés" : " mot affiché");
    if (!items.length) { $("#list").innerHTML = emptyMessage(); return; }
    $("#list").innerHTML = items.map(function (w) {
      var on = favs.has(w.en);
      var lv = levelOf(w.en);
      return '<article class="entry"><div class="tags"><span class="tag">' + tagLabel(w) + '</span><span class="lvl lvl-' + lv + '">' + LEVELS[lv] + "</span></div>" +
        '<div class="entry-top"><h3>' + esc(w.en) + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "") + "</h3>" +
        '<button type="button" class="star" data-fav="' + esc(w.en) + '" aria-pressed="' + on + '" aria-label="À revoir : ' + esc(w.en) + '">' + (on ? "★" : "☆") + "</button></div>" +
        '<p class="fr">' + esc(w.fr) + "</p>" + details(w) + "</article>";
    }).join("");
  }

  /* ---------- Fiches ---------- */
  function rebuildDeck(keepIndex, doShuffle) {
    var list = scopeList();
    card.deck = doShuffle ? shuffle(list) : list;
    card.i = keepIndex ? Math.min(card.i, Math.max(card.deck.length - 1, 0)) : 0;
    card.flipped = false;
  }
  function renderCard(refocus) {
    var box = $("#cardbox");
    var has = card.deck.length > 0;
    $("#prev").disabled = !has; $("#next").disabled = !has;
    $("#flipBtn").disabled = !has; $("#favBtn").disabled = !has;
    if (!has) {
      box.innerHTML = emptyMessage();
      $("#counter").textContent = "";
      return;
    }
    var w = card.deck[card.i];
    var enFront = card.dir === "enfr";
    var html;
    if (!card.flipped) {
      html = enFront
        ? '<span class="face-label">Anglais</span><span class="big">' + esc(w.en) + "</span>" + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "")
        : '<span class="face-label">Français</span><span class="big fr-side">' + esc(w.fr) + "</span>";
      html += '<span class="hint">Touche la fiche pour la retourner. Glisse pour changer de fiche.</span>';
    } else {
      html = enFront
        ? '<span class="face-label">Français</span><span class="big fr-side">' + esc(w.fr) + "</span>"
        : '<span class="face-label">Anglais</span><span class="big">' + esc(w.en) + "</span>" + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "");
      html += '<div class="details">' + details(w) + "</div>";
    }
    box.innerHTML = '<div class="card" id="card" role="button" tabindex="0" aria-label="Retourner la fiche">' + html + "</div>";
    $("#counter").textContent = "Fiche " + (card.i + 1) + " sur " + card.deck.length;
    var on = favs.has(w.en);
    var fb = $("#favBtn");
    fb.setAttribute("aria-pressed", String(on));
    fb.textContent = (on ? "★" : "☆") + " À revoir";
    if (refocus) $("#card").focus({ preventScroll: true });
  }
  function go(step) {
    if (!card.deck.length) return;
    card.i = (card.i + step + card.deck.length) % card.deck.length;
    card.flipped = false;
    renderCard(false);
  }
  function flip() {
    if (!card.deck.length) return;
    card.flipped = !card.flipped;
    renderCard(true);
  }

  /* ---------- Quiz ---------- */
  function optText(w) { return quiz.dir === "enfr" ? w.fr : w.en; }

  function startQuiz() {
    var pool = scopeList();
    if (!pool.length) { renderQuiz(); return; }
    var n = quiz.n === "all" ? pool.length : Math.min(parseInt(quiz.n, 10), pool.length);
    var picked = shuffle(pool).slice(0, n);
    quiz.qs = picked.map(function (w) {
      var others = shuffle(WORDS.filter(function (x) {
        return x !== w && !(w.g && x.g === w.g) && optText(x) !== optText(w);
      }));
      var opts = [w];
      var seen = {};
      seen[optText(w)] = true;
      for (var k = 0; k < others.length && opts.length < 4; k++) {
        var t = optText(others[k]);
        if (seen[t]) continue;
        seen[t] = true;
        opts.push(others[k]);
      }
      return { w: w, opts: shuffle(opts) };
    });
    quiz.phase = "play"; quiz.i = 0; quiz.answered = false; quiz.picked = -1; quiz.score = 0; quiz.wrong = [];
    renderQuiz();
  }

  function renderQuiz(focusSel) {
    var box = $("#quizbox");
    var html = "";
    if (quiz.phase === "setup") {
      var pool = scopeList().length;
      html = '<div class="panel"><h2>Quiz</h2>' +
        "<p>Choisis le sens et le nombre de questions. Les mauvaises réponses viennent des autres mots de la liste.</p>" +
        '<div class="row"><label for="quizDir">Sens</label><select id="quizDir">' +
        '<option value="enfr"' + (quiz.dir === "enfr" ? " selected" : "") + ">Anglais vers français</option>" +
        '<option value="fren"' + (quiz.dir === "fren" ? " selected" : "") + ">Français vers anglais</option></select></div>" +
        '<div class="row"><label for="quizN">Questions</label><select id="quizN">' +
        ["10", "20", "all"].map(function (v) {
          return '<option value="' + v + '"' + (quiz.n === v ? " selected" : "") + ">" + (v === "all" ? "Tous les mots concernés" : v) + "</option>";
        }).join("") + "</select></div>" +
        (pool ? "" : emptyMessage()) +
        '<div class="controls single"><button type="button" class="btn primary" data-q="start"' + (pool ? "" : " disabled") + ">Commencer</button></div></div>";
    } else if (quiz.phase === "play") {
      var cur = quiz.qs[quiz.i];
      var w = cur.w;
      var correctIdx = cur.opts.indexOf(w);
      var enfr = quiz.dir === "enfr";
      html = '<div class="panel"><div class="qhead"><span>Question ' + (quiz.i + 1) + " sur " + quiz.qs.length + "</span><span>Score : " + quiz.score + "</span></div>" +
        '<p class="prompt">' + (enfr ? esc(w.en) + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "") : esc(w.fr)) + "</p>" +
        '<div class="opts">' +
        cur.opts.map(function (o, idx) {
          var cls = "opt";
          if (quiz.answered) {
            if (idx === correctIdx) cls += " good";
            else if (idx === quiz.picked) cls += " bad";
          }
          return '<button type="button" class="' + cls + '" data-q="pick" data-i="' + idx + '"' + (quiz.answered ? " disabled" : "") + ">" + esc(optText(o)) + "</button>";
        }).join("") + "</div>";
      if (quiz.answered) {
        var ok = quiz.picked === correctIdx;
        html += '<p class="feedback ' + (ok ? "good" : "bad") + '">' + (ok ? "Correct." : "Pas tout à fait. Bonne réponse : " + esc(optText(w))) + "</p>" +
          '<div class="details">' + details(w) + "</div>" +
          '<div class="controls single"><button type="button" class="btn primary" data-q="next">' + (quiz.i + 1 === quiz.qs.length ? "Voir le résultat" : "Question suivante") + "</button></div>";
      }
      html += "</div>";
    } else {
      var total = quiz.qs.length;
      html = '<div class="panel"><h2>Résultat</h2><p class="score">' + quiz.score + " / " + total + "</p>";
      if (quiz.wrong.length) {
        html += "<p>Mots à retravailler :</p><ul class=\"errors\">" + quiz.wrong.map(function (x) {
          return "<li><b>" + esc(x.en) + "</b> : " + esc(x.fr) + "</li>";
        }).join("") + "</ul>";
      } else {
        html += "<p>Aucune erreur. Beau travail.</p>";
      }
      html += '<div class="controls' + (quiz.wrong.length ? "" : " single") + '">' +
        '<button type="button" class="btn primary" data-q="again">Rejouer</button>' +
        (quiz.wrong.length ? '<button type="button" class="btn" data-q="favwrong">Mes erreurs en ★</button>' : "") +
        "</div></div>";
    }
    box.innerHTML = html;
    if (focusSel) { var el = box.querySelector(focusSel); if (el) el.focus(); }
  }

  /* ---------- Progression : trois mots par visite, suivi, synchronisation ---------- */
  var byEn = {};
  WORDS.forEach(function (w) { byEn[w.en] = w; });

  var PKEY = "vocabulaire-anglais-progression";
  var SKEY = "vocabulaire-anglais-synchro";
  var SESSKEY = "vocabulaire-anglais-session";
  var DAY = 86400000;
  var INTERVALS = [0, 1, 3, 7, 14, 30]; /* jours avant le prochain rappel, selon la boîte atteinte */
  var LEVELS = { "new": "Nouveau", weak: "À revoir", learning: "En cours", mastered: "Maîtrisé" };

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function dayKeyOf(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayKey() { return dayKeyOf(new Date()); }
  function emptyProgress() { return { v: 1, words: {}, days: {}, updated: 0 }; }

  var progress = (function () {
    try {
      var raw = localStorage.getItem(PKEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && p.words && p.days) return p;
      }
    } catch (e) { /* storage unavailable */ }
    return emptyProgress();
  })();
  function saveLocal() {
    try { localStorage.setItem(PKEY, JSON.stringify(progress)); } catch (e) { /* ignore */ }
  }

  function levelOf(en) {
    var r = progress.words[en];
    if (!r || !r.s) return "new";
    if (r.b >= 4) return "mastered";
    if (r.b >= 1) return "learning";
    return "weak";
  }
  function nextText(r) {
    if (r.b === 0) return "À revoir bientôt";
    var d = INTERVALS[r.b];
    return "Prochain rappel dans " + d + (d > 1 ? " jours" : " jour");
  }

  /* Réponse juste : boîte +1 (5 au maximum). Réponse fausse : retour à la boîte 0. */
  function record(en, ok) {
    var now = Date.now();
    var r = progress.words[en] || { b: 0, s: 0, r: 0, w: 0, l: 0, d: 0 };
    r.s++;
    if (ok) r.r++; else r.w++;
    r.b = ok ? Math.min(r.b + 1, 5) : 0;
    r.l = now;
    r.d = now + INTERVALS[r.b] * DAY;
    progress.words[en] = r;
    var k = todayKey();
    var dd = progress.days[k] || { n: 0, ok: 0 };
    dd.n++;
    if (ok) dd.ok++;
    progress.days[k] = dd;
    progress.updated = now;
    saveLocal();
    scheduleSync();
    return r;
  }

  /* Tirage au hasard pondéré : mots ratés d'abord, puis mots à réviser, puis mots jamais vus. */
  function weightOf(w, now) {
    var r = progress.words[w.en];
    var x;
    if (!r || !r.s) x = 3;
    else if (r.b === 0) x = 6;
    else if (now >= r.d) x = 4 + Math.min((now - r.d) / DAY, 10) * 0.3;
    else x = r.b >= 4 ? 0.15 : 0.4;
    if (r && now - r.l < 1800000) x *= 0.1;
    return x;
  }
  function drawWords(n) {
    var now = Date.now();
    var pool = WORDS.map(function (w) { return { w: w, x: weightOf(w, now) }; });
    var out = [];
    for (var i = 0; i < n && pool.length; i++) {
      var total = pool.reduce(function (a, p) { return a + p.x; }, 0);
      var t = Math.random() * total;
      var idx = 0;
      for (; idx < pool.length - 1; idx++) {
        t -= pool[idx].x;
        if (t <= 0) break;
      }
      out.push(pool[idx].w);
      pool.splice(idx, 1);
    }
    return out;
  }

  function streakDays() {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    function has(x) { var e = progress.days[dayKeyOf(x)]; return !!(e && e.n > 0); }
    if (!has(d)) d.setDate(d.getDate() - 1);
    var n = 0;
    while (has(d)) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  /* ---------- Trois mots du jour ---------- */
  var daily = { ids: [], rated: {}, revealed: {}, dir: "enfr", t: 0 };
  function saveDaily() {
    try { sessionStorage.setItem(SESSKEY, JSON.stringify(daily)); } catch (e) { /* ignore */ }
  }
  function newDraw() {
    daily.ids = drawWords(3).map(function (w) { return w.en; });
    daily.rated = {};
    daily.revealed = {};
    daily.t = Date.now();
    saveDaily();
  }
  function allRated() {
    return daily.ids.every(function (id) { return daily.rated.hasOwnProperty(id); });
  }
  (function restoreDaily() {
    try {
      var raw = sessionStorage.getItem(SESSKEY);
      if (raw) {
        var s = JSON.parse(raw);
        var fresh = s && s.t && Date.now() - s.t < 1800000;
        if (fresh && Array.isArray(s.ids) && s.ids.length === 3 && s.ids.every(function (id) { return byEn[id]; })) {
          daily = { ids: s.ids, rated: s.rated || {}, revealed: s.revealed || {}, dir: s.dir === "fren" ? "fren" : "enfr", t: s.t };
          if (!allRated()) return;
          daily.dir = daily.dir;
        }
        if (s && s.dir === "fren") daily.dir = "fren";
      }
    } catch (e) { /* ignore */ }
    var keepDir = daily.dir;
    newDraw();
    daily.dir = keepDir;
    saveDaily();
  })();

  function frontHTML(w) {
    return daily.dir === "enfr"
      ? '<div class="dword">' + esc(w.en) + "</div>" + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "")
      : '<div class="dword fr-side">' + esc(w.fr) + "</div>";
  }
  function answerHTML(w) {
    return '<div class="answer">' + (daily.dir === "enfr"
      ? '<p class="fr">' + esc(w.fr) + "</p>"
      : '<div class="dword">' + esc(w.en) + "</div>" + (w.pron ? '<span class="pron">' + esc(w.pron) + "</span>" : "")) +
      details(w) + "</div>";
  }
  function dailyCardHTML(w) {
    var rated = daily.rated.hasOwnProperty(w.en);
    var ok = rated && daily.rated[w.en];
    var on = favs.has(w.en);
    var lv = levelOf(w.en);
    var h = '<article class="dcard' + (rated ? (ok ? " ok" : " ko") : "") + '" data-w="' + esc(w.en) + '">' +
      '<div class="dtop"><div class="tags"><span class="tag">' + tagLabel(w) + '</span><span class="lvl lvl-' + lv + '">' + LEVELS[lv] + "</span></div>" +
      '<button type="button" class="star" data-fav="' + esc(w.en) + '" aria-pressed="' + on + '" aria-label="À revoir : ' + esc(w.en) + '">' + (on ? "★" : "☆") + "</button></div>" +
      frontHTML(w);
    if (!daily.revealed[w.en]) {
      h += '<button type="button" class="btn primary wide" data-d="reveal">Voir la réponse</button>';
    } else {
      h += answerHTML(w);
      if (!rated) {
        h += '<div class="rate"><button type="button" class="btn no" data-d="no">Je ne savais pas</button>' +
          '<button type="button" class="btn primary" data-d="yes">Je savais</button></div>';
      } else {
        h += '<p class="result ' + (ok ? "good" : "bad") + '">' + (ok ? "Su." : "À revoir.") +
          ' <span class="nextnote">' + esc(nextText(progress.words[w.en])) + "</span></p>";
      }
    }
    return h + "</article>";
  }
  function dailySummary() {
    if (!allRated()) return "";
    var yes = daily.ids.filter(function (id) { return daily.rated[id]; }).length;
    var no = daily.ids.length - yes;
    return '<div class="panel dsum"><h2>Séance terminée</h2><p>Trois mots travaillés : ' + yes + (yes > 1 ? " sus, " : " su, ") + no + " à revoir.</p>" +
      '<div class="controls single"><button type="button" class="btn primary" data-d="again">Trois autres mots</button></div></div>';
  }
  function updateDailyInfo() {
    var t = progress.days[todayKey()] || { n: 0, ok: 0 };
    var s = streakDays();
    $("#dailyInfo").textContent = "Aujourd’hui : " + t.n + (t.n > 1 ? " réponses" : " réponse") + ". Série : " + s + (s > 1 ? " jours." : " jour.");
  }
  function renderDaily() {
    $("#dailyDir").value = daily.dir;
    $("#dcards").innerHTML = daily.ids.map(function (id) { return dailyCardHTML(byEn[id]); }).join("");
    $("#dsummary").innerHTML = dailySummary();
    updateDailyInfo();
  }
  function findDailyCard(en) {
    var cards = document.querySelectorAll("#dcards .dcard");
    for (var i = 0; i < cards.length; i++) if (cards[i].getAttribute("data-w") === en) return cards[i];
    return null;
  }
  function onDailyClick(e) {
    var b = e.target.closest("[data-d]");
    if (b) {
      var act = b.getAttribute("data-d");
      if (act === "again") {
        newDraw();
        renderDaily();
        try { window.scrollTo(0, 0); } catch (err) { /* ignore */ }
        return;
      }
      var art = b.closest(".dcard");
      if (!art) return;
      var en = art.getAttribute("data-w");
      var w = byEn[en];
      if (act === "reveal") {
        daily.revealed[en] = true;
      } else if ((act === "yes" || act === "no") && !daily.rated.hasOwnProperty(en)) {
        daily.rated[en] = (act === "yes");
        record(en, act === "yes");
      }
      daily.t = Date.now();
      saveDaily();
      art.outerHTML = dailyCardHTML(w);
      $("#dsummary").innerHTML = dailySummary();
      updateDailyInfo();
      var again = $("#dsummary [data-d=\"again\"]");
      var nextBtn = findDailyCard(en).querySelector("[data-d=\"yes\"]");
      if (act === "reveal" && nextBtn) nextBtn.focus({ preventScroll: true });
      else if (again) again.focus({ preventScroll: false });
      return;
    }
    var f = e.target.closest("[data-fav]");
    if (f) setFav(f.getAttribute("data-fav"));
  }

  /* ---------- Suivi ---------- */
  var resetArmed = false;
  function renderStats() {
    var c = { "new": 0, weak: 0, learning: 0, mastered: 0 };
    WORDS.forEach(function (w) { c[levelOf(w.en)]++; });
    var total = WORDS.length;
    var seen = 0, right = 0;
    Object.keys(progress.words).forEach(function (k) {
      if (!byEn[k]) return;
      seen += progress.words[k].s || 0;
      right += progress.words[k].r || 0;
    });
    var rate = seen ? Math.round(100 * right / seen) + " %" : "-";
    var t = progress.days[todayKey()] || { n: 0, ok: 0 };
    function pct(n) { return (100 * n / total).toFixed(2); }

    var names = ["D", "L", "M", "M", "J", "V", "S"];
    var wk = [], max = 1;
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() - i);
      var e = progress.days[dayKeyOf(d)] || { n: 0, ok: 0 };
      wk.push({ lab: names[d.getDay()], n: e.n, ok: e.ok, today: i === 0 });
      if (e.n > max) max = e.n;
    }
    var week = wk.map(function (x) {
      var col = x.n
        ? '<div class="col" style="height:' + Math.max(8, Math.round(100 * x.n / max)) + '%"><i class="c-ko" style="flex:' + (x.n - x.ok) + '"></i><i class="c-ok" style="flex:' + x.ok + '"></i></div>'
        : '<div class="col zero"></div>';
      return '<div class="wday' + (x.today ? " today" : "") + '"><span class="num">' + (x.n || "") + '</span><div class="area">' + col + '</div><span class="lab">' + x.lab + "</span></div>";
    }).join("");

    var weak = Object.keys(progress.words).filter(function (k) { return byEn[k] && progress.words[k].w > 0; })
      .sort(function (a, b) {
        var x = progress.words[a], y = progress.words[b];
        return (y.w - x.w) || (x.b - y.b) || (y.l - x.l);
      }).slice(0, 8);
    var weakHTML = weak.length
      ? '<ul class="errors">' + weak.map(function (k) {
          var x = progress.words[k];
          return "<li><b>" + esc(k) + "</b> : " + esc(byEn[k].fr.split(" ; ")[0]) + '<br><span class="nextnote">' + x.w + (x.w > 1 ? " erreurs" : " erreur") + " sur " + x.s + (x.s > 1 ? " réponses" : " réponse") + "</span></li>";
        }).join("") + "</ul>"
      : "<p class=\"meta\">Aucune erreur pour l’instant.</p>";

    var syncHTML;
    if (sync) {
      syncHTML = "<p>Synchronisation active : ta progression est la même sur tous les appareils où tu as saisi ta phrase secrète.</p>" +
        '<div class="sync-form"><button type="button" class="btn" data-s="syncnow">Synchroniser maintenant</button>' +
        '<button type="button" class="btn" data-s="syncoff">Désactiver sur cet appareil</button></div>';
    } else {
      syncHTML = "<p>Pour l’instant, ta progression reste sur cet appareil, et Safari peut l’effacer si tu ne reviens pas pendant longtemps. " +
        "Pour la garder et la retrouver sur plusieurs appareils, choisis une phrase secrète d’au moins 8 caractères, puis retape la même sur chaque appareil.</p>" +
        '<div class="sync-form"><input type="password" id="syncPass" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Phrase secrète" aria-label="Phrase secrète">' +
        '<button type="button" class="btn primary" data-s="syncon">Activer la synchronisation</button></div>';
    }

    var resetHTML = resetArmed
      ? '<p>Cela efface toute ta progression sur cet appareil' + (sync ? " et sur la synchronisation" : "") + '. Cette action est définitive.</p>' +
        '<div class="sync-form"><button type="button" class="btn danger" data-s="resetgo">Oui, tout effacer</button><button type="button" class="btn" data-s="resetno">Annuler</button></div>'
      : '<div class="sync-form"><button type="button" class="btn danger" data-s="reset">Effacer ma progression</button></div>';

    $("#statsbox").innerHTML =
      '<div class="kpis">' +
      '<div class="kpi mastered"><b>' + c.mastered + '</b><span>Maîtrisés sur ' + total + "</span></div>" +
      '<div class="kpi learning"><b>' + c.learning + "</b><span>En cours</span></div>" +
      '<div class="kpi weak"><b>' + c.weak + "</b><span>À revoir</span></div>" +
      '<div class="kpi"><b>' + c["new"] + "</b><span>Jamais vus</span></div></div>" +
      '<div class="block"><h3>Progression</h3><div class="bar" role="img" aria-label="' + c.mastered + " mots maîtrisés, " + c.learning + " en cours, " + c.weak + " à revoir, " + c["new"] + ' jamais vus">' +
      '<i class="b-mastered" style="width:' + pct(c.mastered) + '%"></i><i class="b-learning" style="width:' + pct(c.learning) + '%"></i><i class="b-weak" style="width:' + pct(c.weak) + '%"></i></div>' +
      '<div class="legend"><span>Maîtrisé : 4 bonnes réponses d’affilée, espacées</span></div></div>' +
      '<div class="stats3"><div class="kpi"><b>' + streakDays() + "</b><span>Jours d’affilée</span></div>" +
      '<div class="kpi"><b>' + t.n + "</b><span>Réponses aujourd’hui</span></div>" +
      '<div class="kpi"><b>' + rate + "</b><span>Réussite</span></div></div>" +
      '<div class="block"><h3>Sept derniers jours</h3><div class="week">' + week + '</div><div class="legend"><span>Vert : sus. Rouge : à revoir.</span></div></div>' +
      '<div class="block"><h3>Mots à surveiller</h3>' + weakHTML + "</div>" +
      '<div class="block"><h3>Synchronisation</h3>' + syncHTML + '<p class="sync-status" id="syncStatus" aria-live="polite">' + esc(syncMsg) + "</p></div>" +
      '<div class="block"><h3>Remise à zéro</h3>' + resetHTML + "</div>";
  }

  /* ---------- Synchronisation (optionnelle) ---------- */
  var sync = (function () {
    try {
      var raw = localStorage.getItem(SKEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && /^[0-9a-f]{64}$/.test(s.h)) return s;
      }
    } catch (e) { /* ignore */ }
    return null;
  })();
  var syncMsg = "";
  var syncTimer = null;
  var syncBusy = false;
  var syncAgain = false;

  function setSyncMsg(m) {
    syncMsg = m;
    var el = $("#syncStatus");
    if (el) el.textContent = m;
  }
  function clock() { var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  async function sha256Hex(text) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  async function callApi(body, keepalive) {
    var r = await fetch("/api/vocab-progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      keepalive: !!keepalive
    });
    var j = null;
    try { j = await r.json(); } catch (e) { /* not JSON */ }
    if (!r.ok || !j || !j.ok) throw new Error((j && j.error) || ("erreur " + r.status));
    return j;
  }
  function mergeProgress(a, b) {
    if (!b || !b.words || !b.days) return a;
    var out = emptyProgress();
    new Set(Object.keys(a.words).concat(Object.keys(b.words))).forEach(function (k) {
      var x = a.words[k], y = b.words[k];
      if (!x) out.words[k] = y;
      else if (!y) out.words[k] = x;
      else out.words[k] = (y.l > x.l || (y.l === x.l && y.s > x.s)) ? y : x;
    });
    new Set(Object.keys(a.days).concat(Object.keys(b.days))).forEach(function (k) {
      var x = a.days[k], y = b.days[k];
      if (!x) out.days[k] = y;
      else if (!y) out.days[k] = x;
      else out.days[k] = y.n > x.n ? y : x;
    });
    out.updated = Math.max(a.updated || 0, b.updated || 0);
    return out;
  }
  function refreshAfterSync() {
    if (state.tab === "suivi") renderStats();
    if (state.tab === "mots") updateDailyInfo();
  }
  async function syncNow(silent, keepalive) {
    if (!sync) return;
    if (syncBusy) { syncAgain = true; return; }
    syncBusy = true;
    if (!silent) setSyncMsg("Synchronisation en cours…");
    try {
      var j = await callApi({ action: "sync", h: sync.h, progress: progress }, keepalive);
      progress = mergeProgress(progress, j.progress);
      saveLocal();
      refreshAfterSync();
      setSyncMsg("Synchronisé à " + clock() + ".");
    } catch (e) {
      setSyncMsg("Synchronisation impossible pour le moment (" + e.message + "). Ta progression reste enregistrée sur cet appareil.");
    }
    syncBusy = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
  function scheduleSync() {
    if (!sync) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncTimer = null; syncNow(true, false); }, 3000);
  }
  async function enableSync() {
    var inp = $("#syncPass");
    var pass = inp ? inp.value.trim() : "";
    if (pass.length < 8) { setSyncMsg("La phrase secrète doit contenir au moins 8 caractères."); return; }
    setSyncMsg("Connexion en cours…");
    try {
      var h = await sha256Hex("vocabulaire:" + pass);
      var j = await callApi({ action: "sync", h: h, progress: progress }, false);
      progress = mergeProgress(progress, j.progress);
      saveLocal();
      sync = { h: h };
      try { localStorage.setItem(SKEY, JSON.stringify(sync)); } catch (e) { /* ignore */ }
      syncMsg = "Synchronisation activée à " + clock() + ".";
      renderStats();
    } catch (e) {
      setSyncMsg("Activation impossible (" + e.message + ").");
    }
  }
  async function resetAll() {
    progress = emptyProgress();
    saveLocal();
    resetArmed = false;
    var msg = "Progression effacée.";
    if (sync) {
      try { await callApi({ action: "reset", h: sync.h }, false); msg = "Progression effacée sur cet appareil et sur la synchronisation."; }
      catch (e) { msg = "Effacée sur cet appareil, mais pas sur la synchronisation (" + e.message + "). Elle pourrait revenir à la prochaine synchronisation."; }
    }
    newDraw();
    syncMsg = msg;
    renderStats();
  }
  function onStatsClick(e) {
    var b = e.target.closest("[data-s]");
    if (!b) return;
    var a = b.getAttribute("data-s");
    if (a === "syncon") enableSync();
    else if (a === "syncnow") syncNow(false, false);
    else if (a === "syncoff") {
      sync = null;
      try { localStorage.removeItem(SKEY); } catch (err) { /* ignore */ }
      syncMsg = "Synchronisation désactivée sur cet appareil.";
      renderStats();
    }
    else if (a === "reset") { resetArmed = true; renderStats(); }
    else if (a === "resetno") { resetArmed = false; renderStats(); }
    else if (a === "resetgo") resetAll();
  }

  /* ---------- navigation and events ---------- */
  var firstRoute = true;
  var TABS = ["mots", "liste", "fiches", "quiz", "suivi"];
  function route() {
    var h = location.hash.replace("#", "");
    state.tab = TABS.indexOf(h) !== -1 ? h : "mots";
    TABS.forEach(function (t) {
      $("#view-" + t).hidden = (t !== state.tab);
    });
    $("#scopeBar").hidden = (state.tab === "mots" || state.tab === "suivi");
    document.querySelectorAll(".tabs a").forEach(function (a) {
      if (a.getAttribute("data-tab") === state.tab) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (state.tab === "mots") renderDaily();
    if (state.tab === "liste") renderList();
    if (state.tab === "fiches") renderCard(false);
    if (state.tab === "quiz") renderQuiz();
    if (state.tab === "suivi") renderStats();
    if (!firstRoute) { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }
    firstRoute = false;
  }

  function refreshScope() {
    var n = scopeList().length;
    $("#scopeCount").textContent = n + (n > 1 ? " mots" : " mot");
  }

  function setFav(en) {
    if (favs.has(en)) favs.delete(en); else favs.add(en);
    saveFavs();
    var on = favs.has(en);
    document.querySelectorAll("[data-fav]").forEach(function (b) {
      if (b.getAttribute("data-fav") === en) {
        b.setAttribute("aria-pressed", String(on));
        b.textContent = on ? "★" : "☆";
      }
    });
    refreshScope();
    if (state.scope === "fav") {
      renderList();
      rebuildDeck(true, false);
      if (quiz.phase === "setup") renderQuiz();
    }
    if (state.tab === "fiches") renderCard(false);
  }

  function init() {
    $("#count").textContent = WORDS.length + " mots et expressions, de l’anglais vers le français. Prononciation en API, anglais britannique.";
    $("#scope").innerHTML = SCOPES.map(function (s) { return '<option value="' + s[0] + '">' + s[1] + "</option>"; }).join("");
    rebuildDeck(false, false);
    refreshScope();

    $("#scope").addEventListener("change", function (e) {
      state.scope = e.target.value;
      refreshScope();
      rebuildDeck(false, false);
      quiz.phase = "setup";
      route();
    });
    $("#q").addEventListener("input", function (e) { state.query = e.target.value; renderList(); });
    $("#sort").addEventListener("change", function (e) { state.sort = e.target.value; renderList(); });
    $("#dir").addEventListener("change", function (e) { card.dir = e.target.value; card.flipped = false; renderCard(false); });
    $("#shuffle").addEventListener("click", function () { rebuildDeck(false, true); renderCard(false); });
    $("#prev").addEventListener("click", function () { go(-1); });
    $("#next").addEventListener("click", function () { go(1); });
    $("#flipBtn").addEventListener("click", flip);
    $("#favBtn").addEventListener("click", function () {
      if (card.deck.length) setFav(card.deck[card.i].en);
    });
    $("#cardbox").addEventListener("click", function (e) {
      if (e.target.closest("#card")) flip();
    });
    var tx = 0, ty = 0;
    $("#cardbox").addEventListener("touchstart", function (e) {
      var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
    }, { passive: true });
    $("#cardbox").addEventListener("touchend", function (e) {
      var t = e.changedTouches[0];
      var dx = t.clientX - tx, dy = t.clientY - ty;
      if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
    }, { passive: true });
    $("#list").addEventListener("click", function (e) {
      var b = e.target.closest("[data-fav]");
      if (b) setFav(b.getAttribute("data-fav"));
    });
    $("#quizbox").addEventListener("change", function (e) {
      if (e.target.id === "quizDir") quiz.dir = e.target.value;
      if (e.target.id === "quizN") quiz.n = e.target.value;
    });
    $("#quizbox").addEventListener("click", function (e) {
      var b = e.target.closest("[data-q]");
      if (!b) return;
      var act = b.getAttribute("data-q");
      if (act === "start") {
        startQuiz();
      } else if (act === "again") {
        quiz.phase = "setup"; renderQuiz();
      } else if (act === "pick" && !quiz.answered) {
        var idx = parseInt(b.getAttribute("data-i"), 10);
        var cur = quiz.qs[quiz.i];
        quiz.answered = true;
        quiz.picked = idx;
        if (cur.opts[idx] === cur.w) quiz.score++;
        else quiz.wrong.push(cur.w);
        record(cur.w.en, cur.opts[idx] === cur.w);
        renderQuiz('[data-q="next"]');
      } else if (act === "next") {
        if (quiz.i + 1 >= quiz.qs.length) { quiz.phase = "done"; renderQuiz(); try { window.scrollTo(0, 0); } catch (err) { /* ignore */ } }
        else { quiz.i++; quiz.answered = false; quiz.picked = -1; renderQuiz(); try { window.scrollTo(0, 0); } catch (err2) { /* ignore */ } }
      } else if (act === "favwrong") {
        quiz.wrong.forEach(function (w) { favs.add(w.en); });
        saveFavs();
        refreshScope();
        b.textContent = "Ajoutées aux mots à revoir";
        b.disabled = true;
      }
    });
    document.addEventListener("keydown", function (e) {
      if (state.tab !== "fiches") return;
      var tag = e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.key === "ArrowRight") { go(1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); }
      else if ((e.key === " " || e.key === "Enter") && e.target.id === "card") { flip(); e.preventDefault(); }
    });
    $("#dailybox").addEventListener("click", onDailyClick);
    $("#dailyDir").addEventListener("change", function (e) {
      daily.dir = e.target.value === "fren" ? "fren" : "enfr";
      saveDaily();
      renderDaily();
    });
    $("#redraw").addEventListener("click", function () { newDraw(); renderDaily(); });
    $("#statsbox").addEventListener("click", onStatsClick);
    $("#statsbox").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.id === "syncPass") { e.preventDefault(); enableSync(); }
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden" && syncTimer) {
        clearTimeout(syncTimer);
        syncTimer = null;
        syncNow(true, true);
      }
    });
    window.addEventListener("hashchange", route);
    route();
    if (sync) syncNow(true, false);
  }
  init();
})();
</script>
</body>
</html>
